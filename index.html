<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Shift Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer onload="window.__gisLoaded && window.__gisLoaded()"></script>

<style>
:root{
  --bg: #12151b;
  --panel: #1a1f28;
  --panel-2: #212733;
  --border: #2b3240;
  --text: #e9ecf2;
  --muted: #8a93a6;
  --amber: #ff9f43;
  --amber-dim: #7a5a30;
  --green: #6fcf97;
  --red: #e6685f;
  --radius: 10px;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(circle at 15% 0%, rgba(255,159,67,0.06), transparent 40%),
    var(--bg);
  color:var(--text);
  font-family:'Inter',sans-serif;
  min-height:100vh;
  -webkit-tap-highlight-color: transparent;
}

.wrap{
  max-width:520px;
  margin:0 auto;
  padding:28px 18px 60px;
}

header{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  margin-bottom:22px;
  padding-bottom:16px;
  border-bottom:1px solid var(--border);
}
header .brand{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  letter-spacing:0.14em;
  color:var(--amber);
  text-transform:uppercase;
}
header h1{
  font-size:20px;
  margin:4px 0 0;
  font-weight:700;
  letter-spacing:-0.01em;
}
.dot{
  width:8px;height:8px;border-radius:50%;
  display:inline-block;margin-right:6px;
  background:var(--red);
  box-shadow:0 0 0 3px rgba(230,104,95,0.15);
}
.dot.on{
  background:var(--green);
  box-shadow:0 0 0 3px rgba(111,207,151,0.15);
}
.auth-status{
  display:flex;align-items:center;
  font-family:'JetBrains Mono',monospace;
  font-size:11px;color:var(--muted);
}

.card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:18px;
  margin-bottom:14px;
}

label{
  display:block;
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  letter-spacing:0.08em;
  text-transform:uppercase;
  color:var(--muted);
  margin-bottom:8px;
}

select, input[type=time], input[type=date]{
  width:100%;
  background:var(--panel-2);
  border:1px solid var(--border);
  color:var(--text);
  padding:12px 12px;
  border-radius:8px;
  font-size:16px;
  font-family:'Inter',sans-serif;
  appearance:none;
  -webkit-appearance:none;
}
select:focus, input:focus{
  outline:2px solid var(--amber);
  outline-offset:1px;
}

.week-badge{
  margin-top:8px;
  font-family:'JetBrains Mono',monospace;
  font-size:11.5px;
  letter-spacing:0.06em;
  color:var(--amber);
}

.select-wrap{position:relative;}
.select-wrap::after{
  content:"▾";
  position:absolute;
  right:14px; top:50%;
  transform:translateY(-50%);
  color:var(--muted);
  pointer-events:none;
  font-size:12px;
}

.row2{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  gap:12px;
}
.time-select{
  display:flex;
  align-items:center;
  gap:6px;
}
.time-select select{
  flex:1;
  min-width:0;
  text-align:center;
  font-family:'JetBrains Mono',monospace;
}
.time-select span{
  color:var(--muted);
  font-family:'JetBrains Mono',monospace;
}

.equip-grid{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  gap:8px;
}
  
  .equip-item{
  display:flex;
  align-items:center;
  gap:9px;
  background:var(--panel-2);
  border:1px solid var(--border);
  border-radius:8px;
  padding:11px 10px;
  cursor:pointer;
  user-select:none;
  min-width:0;
  transition:border-color .12s, background .12s;
}

  .equip-item.checked{
  border-color:var(--amber-dim);
  background:rgba(255,159,67,0.08);
}
.equip-item input{
  width:16px;height:16px;
  accent-color: var(--amber);
  flex-shrink:0;
}
.equip-item span{
  font-size:9px;
  overflow-wrap:break-word;
  word-break:break-word;
  min-width:0;
}

.section-label{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  letter-spacing:0.1em;
  text-transform:uppercase;
  color:var(--amber);
  margin:0 0 14px;
}

button{
  font-family:'Inter',sans-serif;
  font-weight:600;
  font-size:15px;
  border:none;
  border-radius:8px;
  padding:14px 18px;
  cursor:pointer;
  width:100%;
  transition:filter .12s, opacity .12s;
}
button:active{filter:brightness(0.92);}
button:disabled{opacity:0.45;cursor:not-allowed;}

.btn-google{
  background:var(--panel-2);
  border:1px solid var(--border);
  color:var(--text);
  display:flex;align-items:center;justify-content:center;gap:10px;
}
.btn-save{
  background:var(--amber);
  color:#1a1206;
  margin-top:4px;
}

.status{
  font-family:'JetBrains Mono',monospace;
  font-size:12.5px;
  text-align:center;
  margin-top:12px;
  min-height:16px;
  color:var(--muted);
}
.status.ok{color:var(--green);}
.status.err{color:var(--red);}

footer{
  text-align:center;
  color:var(--muted);
  font-size:11px;
  margin-top:30px;
  font-family:'JetBrains Mono',monospace;
}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div>
      <div class="brand">Shift Log</div>
      <h1>Weekly hours &amp; equipment</h1>
    </div>
    <div class="auth-status">
      <span class="dot" id="authDot"></span>
      <span id="authText">Not signed in</span>
    </div>
  </header>

  <div class="card">
    <p class="section-label">Who &amp; when</p>
    <div style="margin-bottom:14px;">
      <label for="day">Day</label>
      <input type="date" id="day">
      <div id="weekBadge" class="week-badge"></div>
    </div>
    <div class="select-wrap">
      <label for="name">Name</label>
      <select id="name"></select>
    </div>
  </div>

  <div class="card">
    <p class="section-label">Working hours</p>
    <div class="row2">
      <div>
        <label for="fromHour">From</label>
        <div class="time-select">
          <select id="fromHour"></select>
          <span>:</span>
          <select id="fromMin"></select>
        </div>
      </div>
      <div>
        <label for="toHour">To</label>
        <div class="time-select">
          <select id="toHour"></select>
          <span>:</span>
          <select id="toMin"></select>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <p class="section-label">Activity</p>
    <div class="equip-grid" id="equipGrid"></div>
  </div>

  <button class="btn-google" id="btnGoogle">
    <span id="googleBtnText">Sign in with Google</span>
  </button>

  <button class="btn-save" id="btnSave" style="margin-top:10px;" disabled>Save &amp; upload</button>

  <div class="status" id="status"></div>

  <footer>KENGURU · SHIFT LOG · v4.0</footer>
</div>

<script>
/* ============================================================
   CONFIG — EDIT THESE VALUES
   ============================================================ */
const CONFIG = {
  CLIENT_ID: '667641239886-4gt0p32qe736toaqebuuhjefhi2vpc9o.apps.googleusercontent.com', // from Google Cloud Console
  FOLDER_ID: '1SLTBOjXs-lK1Ja168ncpA1EimBPEwKdh',                       // target Drive folder
  NAMES: ['Jávorszky Péter', 'Moldován Péter', 'Jászkolics Viktor', 'Csanálosi Zsolt', 'Parti László', 'Gombás Gusztáv'],
  EQUIPMENT: [
    '4ActiveSB_2015', 
    '4ActiveSB_2017', 
    'UFO_Red', 
    'UFO_Green', 
    'LaunchPad_J', 
    'LaunchPad_K', 
    'Vehico steering robot', 
    'Vehico pedal robot', 
    'Halo steering robot', 
    'General support',
    'Campus workshop',
    'Campus test',
    'Public road driving'
  ]
};
/* ============================================================ */

let accessToken = null;
let tokenClient = null;

// ---------- ISO week helpers ----------
function getISOWeek(date) {
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dayNum = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  const weekNo = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
  return { week: weekNo, year: d.getUTCFullYear() };
}

function dateFromInputValue(value) {
  const [y, m, d] = value.split('-').map(Number);
  return new Date(y, m - 1, d);
}
function toInputValue(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}

function updateWeekBadge() {
  const val = document.getElementById('day').value;
  if (!val) return;
  const d = dateFromInputValue(val);
  const { week, year } = getISOWeek(d);
  document.getElementById('weekBadge').textContent = `W${String(week).padStart(2, '0')} · Week ${week}, ${year}`;
}

function populateDay() {
  const input = document.getElementById('day');
  input.value = toInputValue(new Date());
  input.addEventListener('change', updateWeekBadge);
  updateWeekBadge();
}

function populateTimeSelects() {
  const hourOptions = Array.from({ length: 24 }, (_, h) => String(h).padStart(2, '0'));
  const minOptions = ['00', '15', '30', '45'];

  const fill = (id, opts) => {
    document.getElementById(id).innerHTML = opts.map(o => `<option value="${o}">${o}</option>`).join('');
  };
  fill('fromHour', hourOptions);
  fill('toHour', hourOptions);
  fill('fromMin', minOptions);
  fill('toMin', minOptions);

  document.getElementById('fromHour').value = '08';
  document.getElementById('fromMin').value = '00';
  document.getElementById('toHour').value = '16';
  document.getElementById('toMin').value = '30';
}

function getTime(hourId, minId) {
  return document.getElementById(hourId).value + ':' + document.getElementById(minId).value;
}

function populateNames() {
  const sel = document.getElementById('name');
  sel.innerHTML = CONFIG.NAMES.map(n => `<option value="${n}">${n}</option>`).join('');
}

function populateEquipment() {
  const grid = document.getElementById('equipGrid');
  grid.innerHTML = CONFIG.EQUIPMENT.map((eq, i) => `
    <label class="equip-item" for="eq_${i}">
      <input type="checkbox" id="eq_${i}" value="${eq}">
      <span>${eq}</span>
    </label>
  `).join('');
  grid.querySelectorAll('.equip-item').forEach(item => {
    const cb = item.querySelector('input');
    item.addEventListener('click', (e) => {
      if (e.target !== cb) cb.checked = !cb.checked;
      item.classList.toggle('checked', cb.checked);
    });
  });
}

// ---------- Google auth ----------
window.__gisLoaded = function () {
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CONFIG.CLIENT_ID,
    scope: 'https://www.googleapis.com/auth/drive.file',
    callback: (resp) => {
      if (resp.error) {
        setStatus('Sign-in failed: ' + resp.error, 'err');
        return;
      }
      accessToken = resp.access_token;
      setAuthUI(true);
    }
  });
};

document.getElementById('btnGoogle').addEventListener('click', () => {
  if (!tokenClient) {
    setStatus('Google auth not loaded yet — check your internet connection.', 'err');
    return;
  }
  if (CONFIG.CLIENT_ID.startsWith('YOUR_')) {
    setStatus('Set CONFIG.CLIENT_ID in the file first.', 'err');
    return;
  }
  tokenClient.requestAccessToken({ prompt: accessToken ? '' : 'consent' });
});

function setAuthUI(signedIn) {
  document.getElementById('authDot').classList.toggle('on', signedIn);
  document.getElementById('authText').textContent = signedIn ? 'Signed in' : 'Not signed in';
  document.getElementById('googleBtnText').textContent = signedIn ? 'Signed in — sign in again' : 'Sign in with Google';
  document.getElementById('btnSave').disabled = !signedIn;
}

// ---------- Build & upload xlsx ----------
function buildWorkbook(data) {
  const wsData = [
    ['Week', 'Date', 'Name', 'From', 'To', 'Equipment Used', 'Submitted At'],
    [data.week, data.date, data.name, data.from, data.to, data.equipment.join(', ')]
  ];
  const ws = XLSX.utils.aoa_to_sheet(wsData);
  ws['!cols'] = [{ wch: 12 }, { wch: 22 }, { wch: 16 }, { wch: 8 }, { wch: 8 }, { wch: 45 }, { wch: 22 }];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Log');
  return wb;
}

async function uploadToDrive(blob, filename) {
  const metadata = {
    name: filename,
    parents: [CONFIG.FOLDER_ID],
    mimeType: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
  };
  const boundary = '-------shiftlog' + Date.now();
  const delimiter = '\r\n--' + boundary + '\r\n';
  const closeDelim = '\r\n--' + boundary + '--';

  const metaPart = delimiter + 'Content-Type: application/json\r\n\r\n' + JSON.stringify(metadata);
  const mediaHeader = delimiter + 'Content-Type: ' + metadata.mimeType + '\r\n\r\n';
  const fileBuffer = await blob.arrayBuffer();

  const bodyBlob = new Blob([metaPart, mediaHeader, fileBuffer, closeDelim]);

  const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name', {
    method: 'POST',
    headers: {
      'Authorization': 'Bearer ' + accessToken,
      'Content-Type': 'multipart/related; boundary=' + boundary
    },
    body: bodyBlob
  });

  if (!res.ok) {
    const errText = await res.text();
    throw new Error('Drive upload failed (' + res.status + '): ' + errText);
  }
  return res.json();
}

function setStatus(msg, cls) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status' + (cls ? ' ' + cls : '');
}

document.getElementById('btnSave').addEventListener('click', async () => {
  if (CONFIG.FOLDER_ID.startsWith('YOUR_')) {
    setStatus('Set CONFIG.FOLDER_ID in the file first.', 'err');
    return;
  }
  const dayVal = document.getElementById('day').value;
  const dayDate = dateFromInputValue(dayVal);
  const { week: isoWeek, year: isoYear } = getISOWeek(dayDate);
  const name = document.getElementById('name').value;
  const from = getTime('fromHour', 'fromMin');
  const to = getTime('toHour', 'toMin');
  const equipment = Array.from(document.querySelectorAll('#equipGrid input:checked')).map(cb => cb.value);

  const weekCode = `W${String(isoWeek).padStart(2, '0')}-${isoYear}`;
  const data = { week: weekCode, date: dayVal, name, from, to, equipment };

  const btn = document.getElementById('btnSave');
  btn.disabled = true;
  setStatus('Generating file…');

  try {
    const wb = buildWorkbook(data);
    const arrayBuf = XLSX.write(wb, { type: 'array', bookType: 'xlsx' });
    const blob = new Blob([arrayBuf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const filename = `shiftlog_${data.week}_${name.replace(/\s+/g, '_')}_${Date.now()}.xlsx`;

    setStatus('Uploading to Drive…');
    await uploadToDrive(blob, filename);

    setStatus('Uploaded ✓  ' + filename, 'ok');
  } catch (err) {
    console.error(err);
    setStatus('Upload failed — see console for details.', 'err');
  } finally {
    btn.disabled = false;
  }
});

// ---------- init ----------
populateDay();
populateNames();
populateTimeSelects();
populateEquipment();
</script>
</body>
</html>
